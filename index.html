<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>社内ポータル移転のお知らせ | SGC</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f3f5f2;
      --surface: #ffffff;
      --text: #17231d;
      --muted: #52645b;
      --green: #123d31;
      --green-hover: #0c2f25;
      --gold: #c5a35c;
      --gold-soft: #f6f0e3;
      --border: #d9e0dc;
      --shadow: 0 20px 52px rgba(18, 61, 49, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--page);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      background:
        linear-gradient(180deg, rgba(197, 163, 92, 0.12), transparent 220px),
        var(--page);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
      font-size: 16px;
      line-height: 1.7;
      -webkit-text-size-adjust: 100%;
    }

    main {
      width: min(100%, 640px);
    }

    .notice-card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-top: 5px solid var(--gold);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .notice-body {
      padding: clamp(28px, 7vw, 48px);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--green);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.14em;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 7vw, 2.5rem);
      line-height: 1.35;
      letter-spacing: 0.01em;
    }

    .lead {
      margin: 20px 0 0;
      color: var(--muted);
    }

    .portal-link {
      min-height: 52px;
      margin-top: 28px;
      display: inline-flex;
      width: 100%;
      align-items: center;
      justify-content: center;
      padding: 14px 20px;
      border: 2px solid var(--green);
      border-radius: 10px;
      background: var(--green);
      color: #ffffff;
      font-weight: 700;
      line-height: 1.4;
      text-align: center;
      text-decoration: none;
      touch-action: manipulation;
      transition: background-color 160ms ease, border-color 160ms ease;
    }

    .portal-link:hover {
      border-color: var(--green-hover);
      background: var(--green-hover);
    }

    .portal-link:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 4px;
    }

    .url-label {
      margin: 20px 0 6px;
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 700;
    }

    .portal-url {
      margin: 0;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #f8faf8;
      color: var(--text);
      font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 0.875rem;
      line-height: 1.6;
      overflow-wrap: anywhere;
      user-select: text;
    }

    .details {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    .details p {
      margin: 0;
    }

    .details p + p {
      margin-top: 12px;
    }

    .auth-note {
      color: var(--muted);
    }

    .unavailable-note {
      padding: 12px 14px;
      border-left: 4px solid var(--gold);
      background: var(--gold-soft);
      color: var(--text);
      font-weight: 700;
    }

    @media (max-width: 420px) {
      .notice-card {
        border-radius: 12px;
      }

      .notice-body {
        padding: 28px 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .portal-link {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <article class="notice-card" aria-labelledby="notice-title">
      <div class="notice-body">
        <p class="eyebrow">SGC INTERNAL PORTAL</p>
        <h1 id="notice-title">社内ポータルは移転しました</h1>
        <p class="lead">
          社内ポータルは新しいURLへ移転しました。<br>
          今後は下記の新しい社内ポータルをご利用ください。
        </p>

        <a class="portal-link" href="https://sgc-internal-portal.pages.dev/">新しい社内ポータルを開く</a>

        <p class="url-label">新しいURL</p>
        <p class="portal-url">https://sgc-internal-portal.pages.dev/</p>

        <div class="details">
          <p class="auth-note">ログインには会社メールアドレスによる認証が必要です。</p>
          <p class="unavailable-note">この旧ページでは社内ポータルを利用できません。</p>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
