<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>記念金貨 買取価格表｜印刷用</title>
  <style>
    :root { color-scheme: light; --green: #1e3d2c; --gold: #ad8740; --ink: #24231f; --muted: #67645c; --line: #d9d3c7; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f1ea; color: var(--ink); font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; }
    .toolbar { display: flex; justify-content: center; gap: 12px; padding: 18px; }
    .toolbar a, .toolbar button { border: 1px solid var(--green); border-radius: 6px; padding: 10px 18px; color: var(--green); background: #fff; font: inherit; text-decoration: none; cursor: pointer; }
    .toolbar button { color: #fff; background: var(--green); }
    .sheet { width: min(100%, 1120px); min-height: 780px; margin: 0 auto 24px; padding: 34px 40px; background: #fff; box-shadow: 0 4px 24px #00000014; }
    .heading { display: flex; justify-content: space-between; align-items: end; padding-bottom: 14px; border-bottom: 2px solid var(--gold); }
    h1 { margin: 0; color: var(--green); font-family: "Yu Mincho", "Hiragino Mincho ProN", serif; font-size: 25px; letter-spacing: .12em; }
    .english { margin-top: 5px; color: var(--gold); font: italic 12px Georgia, serif; letter-spacing: .16em; }
    .date { color: var(--muted); font-size: 11px; text-align: right; line-height: 1.7; }
    .notice { margin: 12px 0 14px; padding: 8px 12px; border-left: 3px solid var(--gold); background: #faf7f0; color: #4d493f; font-size: 11px; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; line-height: 1.4; }
    thead { display: table-header-group; }
    th { padding: 8px 7px; background: var(--green); color: #fff; font-weight: 600; text-align: left; }
    td { padding: 6px 7px; border-bottom: 1px solid var(--line); vertical-align: top; }
    tbody tr:nth-child(even) { background: #faf9f6; }
    th:nth-child(2), td:nth-child(2), th:nth-child(3), td:nth-child(3), th:nth-child(4), td:nth-child(4) { text-align: center; white-space: nowrap; }
    th:last-child, td:last-child { text-align: right; white-space: nowrap; }
    td.price { color: var(--green); font-size: 13px; font-weight: 700; }
    .status { padding: 30px; color: var(--muted); text-align: center; }
    .footer { display: flex; justify-content: space-between; margin-top: 10px; color: var(--muted); font-size: 9px; }
    @page { size: A4 landscape; margin: 10mm; }
    @media print {
      body { background: #fff; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .toolbar { display: none; }
      .sheet { width: auto; min-height: 0; margin: 0; padding: 0; box-shadow: none; }
      .notice { break-inside: avoid; }
      tr { break-inside: avoid; }
    }
    @media screen and (max-width: 700px) {
      .sheet { min-height: 0; margin: 0 10px 16px; padding: 22px 16px; overflow-x: auto; }
      .heading { align-items: start; gap: 8px; }
      h1 { font-size: 19px; }
      .date { font-size: 9px; }
      table { min-width: 680px; }
    }
  </style>
</head>
<body>
  <nav class="toolbar" aria-label="印刷操作">
    <a href="coin.html">価格ページへ戻る</a>
    <button type="button" onclick="window.print()">印刷する</button>
  </nav>
  <main class="sheet">
    <header class="heading">
      <div>
        <h1>記念金貨 買取価格表</h1>
        <div class="english">COMMEMORATIVE GOLD COIN · PURCHASE PRICE LIST</div>
      </div>
      <div class="date">価格改定日<br>2026年11月8日</div>
    </header>
    <p class="notice">表示価格は記載の改定日から適用します。実際の買取価格は、金貨の状態や付属品などにより異なる場合があります。</p>
    <div id="tableStatus" class="status">価格表を読み込んでいます…</div>
    <table id="priceTable" hidden>
      <thead><tr><th>記念テーマ</th><th>額面</th><th>量目</th><th>発行年</th><th>直径</th><th>買取価格</th></tr></thead>
      <tbody id="priceRows"></tbody>
    </table>
    <footer class="footer"><span>記念金貨 買取価格</span><span>価格は予告なく改定する場合があります</span></footer>
  </main>
  <script>
    const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    fetch('data/coins.json')
      .then(response => { if (!response.ok) throw new Error('価格データを取得できません'); return response.json(); })
      .then(rows => {
        rows.sort((a, b) => parseFloat(b['量目']) - parseFloat(a['量目']) || a['記念テーマ'].localeCompare(b['記念テーマ'], 'ja'));
        document.getElementById('priceRows').innerHTML = rows.map(row => `<tr><td>${esc(row['記念テーマ'])}</td><td>${esc(row['額面'])}</td><td>${esc(row['量目'])}</td><td>${esc(row['発行年'])}</td><td>${esc(row['直径'])}</td><td class="price">${esc(row['買取価格'])}</td></tr>`).join('');
        document.getElementById('tableStatus').remove();
        document.getElementById('priceTable').hidden = false;
      })
      .catch(error => { document.getElementById('tableStatus').textContent = error.message; });
  </script>
</body>
</html>
